name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: debs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Build deb package
        run: |
          set -euo pipefail
          .xgc2/scripts/package_debs.sh --output-dir "$GITHUB_WORKSPACE/debs"

      - name: Verify package contents
        run: |
          set -euo pipefail
          .xgc2/scripts/check_installed_packages.sh --deb debs/*.deb

      - name: Upload deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xgc2-utils-linux-performance-mode-debs
          path: debs/*.deb
