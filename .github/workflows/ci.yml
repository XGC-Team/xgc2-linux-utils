name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Dependencies come from XGC2 CI images (xgc2-images).
# Extra packages belong in that image repository, not here.

jobs:
  package-compliance:
    name: package-compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check scripts and packaging metadata
        run: |
          set -euo pipefail
          git diff --check HEAD
          bash -n .xgc2/scripts/*.sh
          bash -n .xgc2/debian/postinst
          bash -n .xgc2/debian/prerm
          bash -n .xgc2/debian/postrm
          bash -n .xgc2/debian/xgc2-utils-linux-timezone/postinst
          bash -n .xgc2/debian/xgc2-utils-linux-timezone/prerm
          bash -n .xgc2/debian/xgc2-utils-linux-timezone/postrm
          bash -n scripts/xcli
          bash -n scripts/configure-timezone.sh
          bash -n scripts/configure-time-sync.sh
          python3 .xgc2/scripts/check-workflow-bootstrap.py
  retirement-contract:
    name: retirement-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no retired package can be built or published
        run: |
          set -euo pipefail
          grep -q '^summary: Retired APT product\.' .xgc2/product.yml
          grep -q '^  install: \[\]$' .xgc2/product.yml
          grep -q '^  packages: \[\]$' .xgc2/product.yml
          grep -q '^  paths: \[\]$' .xgc2/product.yml
          grep -q '^  apt_versions: {}$' .xgc2/product.yml

          retirement_log="$(mktemp)"
          if .xgc2/scripts/package_debs.sh --output-dir "$RUNNER_TEMP/debs" >"$retirement_log" 2>&1; then
            echo "retired package builder unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q 'xgc2-utils-linux-\* packages are retired' "$retirement_log"
          test ! -d "$RUNNER_TEMP/debs" || ! find "$RUNNER_TEMP/debs" -name '*.deb' -print -quit | grep -q .
          echo "Retirement contract verified: no install targets, owned paths, APT versions, or build artifacts."
